<!doctype html>
<html lang="en">
<head>
<meta name="mowgli-static" content="/mowgli-site/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies · Mowgli</title>
<link rel="icon" href="/mowgli-site/mowgli-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Temporary list of every profiled company (Adam, 2026-09-29: "for my temporary viewing pleasure"); a normal top-nav section. Its header is the Monitor's, exactly. -->
<style>
:root{--sp:#05090c;--c1:#0e2a2e;--c2:#0b1d26;--c3:#10262a;--tint:#2f8a86;--dust:#8fd6c8;
 --ease:cubic-bezier(.3,.7,.2,1);--dur:.32s;--gap:clamp(16px,1.8vw,48px);--rgap:clamp(14px,2.6vh,40px);--op:.56;
 --card:rgb(12 20 26 / var(--op));--cardbd:rgba(255,255,255,.13);--blur:blur(18px) saturate(1.15);
 --ink:#f2f5f6;--ink2:#cdd5d8;--mut:#93a1a6;--line:rgba(255,255,255,.10);--sub:rgba(255,255,255,.07);--sub2:rgba(255,255,255,.13);
 --chip:#efedea;--up:#5fd3a2;--dn:#ff8f80;--sh:0 18px 50px rgba(0,0,0,.35);
 --accx:#9fdcd2;--accbg:rgba(80,170,160,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(11px,min(.7vw,1.38vh),18px)}
body{background:radial-gradient(ellipse at 40% -10%,#0e2a2e 0%,#0a1a20 45%,#05090c 100%) fixed;color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100vh;padding:clamp(12px,2.2vh,32px) clamp(20px,2.6vw,66px)}
.pad{background:var(--card);border:1px solid var(--cardbd);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.pad{border-radius:22px}
.up{color:var(--up)}.dn{color:var(--dn)}
.head{display:flex;align-items:center;gap:1.6rem}
.home{display:flex;align-items:center;gap:.6rem;text-decoration:none;flex:none}
.home img{width:2.1rem;height:2.1rem;filter:drop-shadow(0 0 8px color-mix(in oklab,var(--tint) 70%,transparent))}
.home span{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.45rem;color:#f3f0e8}
.srch{display:flex;align-items:center;gap:.55rem;width:min(26rem,100%);padding:.5rem .6rem .5rem .85rem;border-radius:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:text}
.srch svg{width:1rem;height:1rem;fill:none;stroke:#b9c4c8;stroke-width:1.6;flex:none}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 .9rem Manrope;color:#eef3f4}
.srch input::placeholder{color:#94a2a7}
.srch kbd{font:700 .72rem Manrope;color:#b9c4c8;border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:.05rem .4rem}
.srch:focus-within{border-color:color-mix(in oklab,var(--tint) 60%,#fff);background:rgba(255,255,255,.1)}
.pg{font-size:.8rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#aab8bc;opacity:.85}
.tnav{display:flex;gap:.3rem}.tnav a{font-size:.8rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#aab4ba;text-decoration:none;padding:.35rem .8rem;border-radius:20px;opacity:.85}.tnav a:hover{color:#fff;opacity:1}.tnav a.on{color:#fff;background:rgba(255,255,255,.1);opacity:1}
.tnav a.soon{opacity:.38;cursor:default}.tnav a.soon:hover{color:#aab4ba;opacity:.38}
.stat{margin-left:auto;display:flex;align-items:center;gap:.7rem;font-size:.85rem;color:var(--ink2);padding:.55rem 1.1rem;border-radius:30px}
.stat i{width:.55rem;height:.55rem;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.stat.off i{background:var(--mut);box-shadow:none}.stat.bad i{background:#e8c53a;box-shadow:0 0 8px #e8c53a}
.stat b{color:var(--ink)}
.srch{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + .4rem);z-index:60;display:none;flex-direction:column;padding:.35rem;border-radius:16px;background:rgba(10,18,22,.94);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.sugg.on{display:flex}
.sugg a{display:grid;grid-template-columns:3.6rem 3.4rem 1fr;align-items:center;gap:.6rem;padding:.35rem .5rem;border-radius:10px;color:#dfe6e8;text-decoration:none;font:500 .85rem Manrope}
.sugg a b{font-weight:800;letter-spacing:.5px;color:#fff}
.sugg a img{height:1.3rem;width:3.4rem;object-fit:contain;background:var(--chip);border-radius:6px;padding:.1rem .3rem}
.sugg a .nl{height:1.3rem;width:3.4rem;border-radius:6px;background:rgba(255,255,255,.08)}
.sugg a.sel,.sugg a:hover{background:rgba(255,255,255,.1)}
.stat[hidden]{display:none}
.body{margin-top:clamp(14px,2.4vh,38px)}
.bar2{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.bar2 h1{font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:800}
.bar2 input{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;color:var(--ink);font:500 14px Manrope,system-ui,sans-serif;padding:8px 16px;width:min(22rem,100%);outline:0}
.lay{display:grid;grid-template-columns:17rem minmax(0,56rem);gap:var(--gap);align-items:start;justify-content:start}
.rail{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto;padding:.9rem .6rem;scrollbar-width:thin}
.rail a{display:flex;gap:.5rem;align-items:baseline;text-decoration:none;color:var(--ink2);font:500 .85rem Manrope,system-ui,sans-serif;padding:.28rem .6rem;border-radius:9px;line-height:1.25}
.rail a i{font-style:normal;color:var(--dust);font-weight:700;min-width:1.9rem;font-variant-numeric:tabular-nums}
.rail a.c{font-weight:700;color:var(--ink);margin-top:.5rem}
.rail a.s{padding-left:1.6rem;color:var(--mut)}.rail a.s i{color:var(--accx);opacity:.8}
.rail a:hover{background:rgba(255,255,255,.07);color:#fff}
.rail a.on{background:var(--accbg);color:#fff}
.rt{display:flex;align-items:baseline;gap:.5rem;width:100%;background:none;border:0;border-radius:9px;text-align:left;color:var(--ink);font:700 .85rem Manrope,system-ui,sans-serif;padding:.28rem .6rem;line-height:1.25;margin-top:.5rem;cursor:pointer}
.rt svg{width:.7rem;height:.7rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s;align-self:center}
.rt[aria-expanded=true] svg{transform:rotate(90deg)}
.rt i{font-style:normal;color:var(--dust);font-weight:700;min-width:1.2rem;font-variant-numeric:tabular-nums}
.rt:hover{background:rgba(255,255,255,.07);color:#fff}.rt.on{background:var(--accbg);color:#fff}
.rt:focus-visible,.chip:focus-visible{outline:2px solid var(--accx);outline-offset:1px}
.rs[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:-.4rem 0 1.1rem;max-width:calc(17rem + var(--gap) + 56rem)}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--sub2);border-radius:999px;color:var(--ink2);font:600 .8rem Manrope,system-ui,sans-serif;padding:.32rem .85rem;cursor:pointer;text-decoration:none}
.chip i{font-style:normal;color:var(--dust);font-weight:800;margin-right:.4rem}
.chip:hover{color:#fff;background:rgba(255,255,255,.13)}
.main{min-width:0}
.cat{padding:.8rem 1.1rem .9rem;margin-bottom:.9rem;scroll-margin-top:1rem}
.cat h2{display:flex;align-items:baseline;font:600 1.45rem Fraunces,Georgia,serif;color:#f3f0e8;padding-bottom:.4rem;border-bottom:1px solid var(--line);margin-bottom:.2rem}
.ea{margin-left:auto;background:none;border:1px solid var(--sub2);border-radius:999px;color:var(--mut);font:700 .68rem Manrope,system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;padding:.2rem .7rem;cursor:pointer}.ea:hover{color:#fff;background:rgba(255,255,255,.08)}
.cat h2 i{font-style:normal;color:var(--dust);margin-right:.6rem}
.sub{scroll-margin-top:1rem;margin-top:.15rem;border-bottom:1px solid var(--sub)}
.sub h3{font-size:.8rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.tg{display:flex;align-items:center;gap:.5rem;width:100%;background:none;border:0;border-radius:9px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;padding:.4rem .4rem;cursor:pointer}
.tg:hover{background:rgba(255,255,255,.07);color:#fff}
.tg:focus-visible,.ea:focus-visible{outline:2px solid var(--accx);outline-offset:1px}
.tg svg{width:.8rem;height:.8rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.tg[aria-expanded=true] svg{transform:rotate(90deg)}
.tg i{font-style:normal;color:var(--accx)}
.tg em{margin-left:auto;font-style:normal;font-weight:600;letter-spacing:0;color:var(--mut);opacity:.7}
.sub .tb{padding-bottom:.4rem}
.tb[hidden]{display:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) 4.2rem 5.6rem 4.6rem;align-items:center;gap:.7rem;padding:.18rem .5rem;border-radius:9px;color:var(--ink);text-decoration:none;font:500 .88rem Manrope,system-ui,sans-serif;border-bottom:1px solid var(--sub)}
.row.hd{font-size:.68rem;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
.co{display:flex;align-items:center;gap:.6rem;min-width:0}
.co img{width:2.6rem;height:1.35rem;object-fit:contain;background:#f4f2ee;border-radius:5px;padding:.1rem .25rem;flex:none}
.co .nl{width:2.6rem;height:1.35rem;flex:none}
.co span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font-weight:800;letter-spacing:.04em;font-size:.82rem}
.row .n{text-align:right;font-variant-numeric:tabular-nums}
a.row:hover{background:rgba(255,255,255,.09)}
div.row:not(.hd){color:var(--mut)}div.row:not(.hd) .co span{opacity:.75}
.none{color:var(--mut);padding:2rem;text-align:center}
@media(max-width:820px){.lay{grid-template-columns:1fr}.rail{display:none}.row{grid-template-columns:minmax(0,1fr) 3.6rem 4.6rem 3.8rem;gap:.4rem;font-size:.8rem}.co img,.co .nl{display:none}}
</style>
</head>
<body>
<div class="head">
  <a class="home" href="/mowgli-site/" title="Mowgli home"><img src="/mowgli-site/mowgli-mark.svg" alt=""><span>Mowgli</span></a>
  <label class="srch"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.4 3.4"/></svg><input id="q" type="search" placeholder="Search a company or ticker…" aria-label="Search a company or ticker" autocomplete="off"><kbd>/</kbd><div class="sugg" id="sugg"></div></label>
  <nav class="tnav"><a href="/mowgli-site/">Monitor</a><a class="soon" title="coming">News</a><a class="soon" title="coming">Performance</a><a href="/mowgli-site/list/" class="on" aria-current="page">List</a></nav>
  <div class="stat pad off" id="stat" hidden><i></i><span></span></div>
</div>
<div class="body">
<div class="bar2"><h1>Cats and Subs</h1><input id="f" type="search" placeholder="Filter…" aria-label="Filter companies"></div>
<nav class="chips" id="cc" aria-label="Jump to a Cat"></nav>
<div class="lay"><nav class="rail pad" id="rail" aria-label="Cats and Subs"></nav><div class="main" id="g"></div></div>
</div>
<script src="/mowgli-site/config.js"></script>
<script src="/mowgli-site/site.js"></script>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let all = [], G = null, Q = {};
const sym = (t) => String(t || '').trim().toUpperCase().replace(/[./ ]/g, '-');
const money = (n) => (n == null || !isFinite(n) || n <= 0) ? '—' : n >= 1e12 ? '$' + (n / 1e12).toFixed(2).replace(/\.?0+$/, '') + 'T' : n >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'B' : '$' + Math.round(n / 1e6) + 'M';
const pct = (d) => d == null || !isFinite(d) ? '<span class="n">—</span>' : `<span class="n ${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${d > 0 ? '+' : ''}${d.toFixed(2)}%</span>`;
function draw(q) {
  q = q.trim().toLowerCase();
  const filt = !!q;
  const g = document.getElementById('g'), rail = document.getElementById('rail');
  if (!G) { g.innerHTML = ''; return; }
  const pages = new Map(all.map((c) => [sym(c.ticker), c]));
  const nameOf = (t) => (pages.get(t) || {}).name || (Q[t] || {}).n || '';
  const hit = (t) => !q || t.toLowerCase().includes(q) || nameOf(t).toLowerCase().includes(q);
  const cap = (t) => { const v = (Q[t] || {}).cap; return v > 0 ? v : -1; };
  const row = (t) => {
    const c = pages.get(t), x = Q[t] || {}, nm = nameOf(t) || t;
    const inner = `<span class="co">${c && c.logo ? `<img src="${esc(c.logo)}" alt="">` : '<span class="nl"></span>'}<span>${esc(nm)}</span></span><b>${esc(c ? c.ticker : t)}</b><span class="n">${money(x.cap)}</span>${pct(x.d)}`;
    return c ? `<a class="row" href="${MG.pageUrl(c.ticker)}">${inner}</a>` : `<div class="row">${inner}</div>`;
  };
  const hd = '<div class="row hd"><span>Company</span><span>Ticker</span><span class="n">Market cap</span><span class="n">Today</span></div>';
  const table = (ts) => { ts = ts.filter(hit).sort((a, b) => cap(b) - cap(a) || a.localeCompare(b)); if (!ts.length) return ''; return ts; };
  const tb = (ts, extra) => `<div class="tb"${extra || ''}>${hd}${ts.map(row).join('')}</div>`;
  const inCat = {};
  for (const [t, v] of Object.entries(G.co)) {
    if (v[4] || !v[0]) continue;
    ((inCat[v[0]] ||= {})[v[1] || ''] ||= []).push(t);
  }
  let html = '', nav = '', chips = '';
  G.cats.forEach((c, i) => {
    const m = inCat[c.id] || {};
    const direct = table(m[''] || []);
    let body = direct.length ? tb(direct) : '', sn = '', nsub = 0;
    c.subs.forEach((s, j) => { const x = table(m[s.id] || []); if (x.length) { const id = `s-${i + 1}-${j + 1}`, o = filt || OPEN.has(id) || id === JUMP; nsub++; body += `<div class="sub" id="${id}"><h3><button type="button" class="tg" aria-expanded="${o}" aria-controls="${id}-t"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5 7 5 3 8.5"/></svg><i>${i + 1}.${j + 1}</i>${esc(s.name)}<em>${x.length}</em></button></h3>${tb(x, ` id="${id}-t"${o ? '' : ' hidden'}`)}</div>`; sn += `<a class="s" href="#s-${i + 1}-${j + 1}"><i>${i + 1}.${j + 1}</i>${esc(s.name)}</a>`; } });
    if (body) { html += `<section class="cat pad" id="c-${i + 1}"><h2><i>${i + 1}</i>${esc(c.name)}${nsub > 1 ? '<button type="button" class="ea"></button>' : ''}</h2>${body}</section>`; const ro = RAILOPEN.has(`c-${i + 1}`) || filt || JUMPCAT === `c-${i + 1}`; nav += `<div class="rc" id="rc-${i + 1}"><button type="button" class="rt" data-c="c-${i + 1}" aria-expanded="${ro}" aria-controls="rs-${i + 1}"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5 7 5 3 8.5"/></svg><i>${i + 1}</i>${esc(c.name)}</button><div class="rs" id="rs-${i + 1}"${ro ? '' : ' hidden'}>${sn}</div></div>`; chips += `<a class="chip" href="#c-${i + 1}"><i>${i + 1}</i>${esc(c.name)}</a>`; }
  });
  const loose = all.filter((c) => { const v = G.co[sym(c.ticker)]; return !(v && (v[4] ? G.co[v[4]]?.[0] : v[0])); }).map((c) => sym(c.ticker));
  const lb = table(loose);
  if (lb.length) { html += `<section class="cat pad" id="c-x"><h2>Not yet placed</h2>${tb(lb)}</section>`; nav += '<a class="c" href="#c-x"><i></i>Not yet placed</a>'; chips += '<a class="chip" href="#c-x">Not yet placed</a>'; }
  document.getElementById('cc').innerHTML = chips;
  g.innerHTML = html || '<div class="none">No match.</div>';
  rail.innerHTML = nav;
  document.querySelectorAll('.cat').forEach(eaLabel);
  watch();
  if (!jumped && location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) { jumped = true; t.scrollIntoView(); } } // the first draw with the Cats in it
}
let jumped = false;
// a link from a company page (#c-2, #s-2-3): that Sub and its Cat open this visit, whatever the saved state says (not saved)
const JUMP = /^s-\d+-\d+$/.test(location.hash.slice(1)) ? location.hash.slice(1) : '', JUMPCAT = location.hash.slice(1).replace(/^s-(\d+)-\d+$/, 'c-$1');
const RAILOPEN = new Set();
try { JSON.parse(localStorage.getItem('mgListRailOpen') || '[]').forEach((x) => RAILOPEN.add(x)); } catch {}
const saveRail = () => { try { localStorage.setItem('mgListRailOpen', JSON.stringify([...RAILOPEN])); } catch {} };
function setRail(btn, o) { btn.setAttribute('aria-expanded', o); btn.nextElementSibling.hidden = !o; }
document.getElementById('rail').addEventListener('click', (e) => {
  const b = e.target.closest('.rt'); if (!b) return;
  const o = b.getAttribute('aria-expanded') !== 'true';
  setRail(b, o);
  if (!filtering()) { o ? RAILOPEN.add(b.dataset.c) : RAILOPEN.delete(b.dataset.c); saveRail(); }
});
const scrollTo2 = (id) => { const t = document.getElementById(id); if (t) t.scrollIntoView({ behavior: 'smooth' }); };
document.getElementById('cc').addEventListener('click', (e) => { const a = e.target.closest('.chip'); if (!a) return; e.preventDefault(); scrollTo2(a.getAttribute('href').slice(1)); });
const OPEN = new Set();
try { JSON.parse(localStorage.getItem('mgListOpen') || '[]').forEach((x) => OPEN.add(x)); } catch {}
const saveOpen = () => { try { localStorage.setItem('mgListOpen', JSON.stringify([...OPEN])); } catch {} };
const filtering = () => !!document.getElementById('f').value.trim();
function setSub(sub, o) {
  const b = sub.querySelector('.tg'), t = sub.querySelector('.tb');
  b.setAttribute('aria-expanded', o); t.hidden = !o;
  if (!filtering()) { o ? OPEN.add(sub.id) : OPEN.delete(sub.id); }
}
function eaLabel(cat) {
  const b = cat.querySelector('.ea'); if (!b) return;
  const subs = [...cat.querySelectorAll('.sub')];
  b.textContent = subs.every((s) => !s.querySelector('.tb').hidden) ? 'Collapse all' : 'Expand all';
}
document.getElementById('g').addEventListener('click', (e) => {
  const tg = e.target.closest('.tg'), ea = e.target.closest('.ea');
  if (tg) { const sub = tg.closest('.sub'); setSub(sub, tg.getAttribute('aria-expanded') !== 'true'); eaLabel(sub.closest('.cat')); saveOpen(); }
  else if (ea) { const cat = ea.closest('.cat'), o = ea.textContent === 'Expand all'; cat.querySelectorAll('.sub').forEach((s) => setSub(s, o)); eaLabel(cat); saveOpen(); }
});
let io = null;
function watch() {
  if (io) io.disconnect();
  const links = [...document.querySelectorAll('#rail a')];
  const mark = (id) => {
    links.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + id));
    const cid = id.startsWith('s-') ? 'c-' + id.split('-')[1] : id;
    document.querySelectorAll('#rail .rt').forEach((b) => { b.classList.toggle('on', b.dataset.c === id); if (b.dataset.c === cid && b.getAttribute('aria-expanded') !== 'true') setRail(b, true); });
  };
  links.forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); const t = document.querySelector(a.getAttribute('href')); if (t && t.classList.contains('sub')) { setSub(t, true); eaLabel(t.closest('.cat')); saveOpen(); } if (t) t.scrollIntoView({ behavior: 'smooth' }); mark(a.getAttribute('href').slice(1)); }));
  const els = [...document.querySelectorAll('.cat,.sub')];
  io = new IntersectionObserver((en) => { const v = en.filter((x) => x.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0]; if (v) { mark(v.target.id); const a = document.querySelector('#rail a.on'); if (a) a.scrollIntoView({ block: 'nearest' }); } }, { rootMargin: '0px 0px -75% 0px' });
  els.forEach((x) => io.observe(x));
}
fetch(MG.companiesUrl()).then((r) => r.json()).then((list) => {
  all = list.sort((a, b) => a.name.localeCompare(b.name));
  draw(document.getElementById('f').value);
  setupSwitcher();
});
document.getElementById('f').addEventListener('input', (e) => draw(e.target.value));

/* header search: same as the Monitor and company page */
function setupSwitcher() {
  const q = document.getElementById('q'), box = document.getElementById('sugg');
  let sel = 0, hits = [];
  const show = () => {
    const s = q.value.trim().toUpperCase();
    if (!s) { box.classList.remove('on'); return; }
    hits = all.filter((c) => c.ticker.startsWith(s) || c.aliases.some((a) => a.startsWith(s))).concat(all.filter((c) => !c.ticker.startsWith(s) && !c.aliases.some((a) => a.startsWith(s)) && c.name.toUpperCase().includes(s))).slice(0, 8);
    sel = 0;
    box.innerHTML = hits.map((c, i) => `<a href="${MG.pageUrl(c.ticker)}" class="${i === sel ? 'sel' : ''}">${c.logo ? `<img src="${esc(c.logo)}" alt="">` : '<span class="nl"></span>'}<b>${esc(c.ticker)}</b><span>${esc(c.name)}</span></a>`).join('') || '<a><span></span><b></b><span>No match among the profiled companies</span></a>';
    box.classList.add('on');
  };
  q.addEventListener('input', show);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % Math.max(1, hits.length); [...box.children].forEach((a, i) => a.classList.toggle('sel', i === sel)); }
    else if (e.key === 'Enter' && hits[sel]) location.href = MG.pageUrl(hits[sel].ticker);
    else if (e.key === 'Escape') { q.value = ''; box.classList.remove('on'); q.blur(); }
  });
  q.addEventListener('blur', () => setTimeout(() => box.classList.remove('on'), 150));
  addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); q.focus(); } });
}

/* market-status pill, same wording as the Monitor; hidden if no data can be had */
(async () => {
  const TXT = { open: 'Market open', 'pre-market': 'Pre-market', 'after hours': 'After hours', closed: 'Market closed' };
  let p = null, stale = false;
  try { const u = MG.monitorUrl(); if (!u) throw 0; p = await fetch(u).then((r) => { if (!r.ok) throw 0; return r.json(); }); stale = !!p.stale; }
  catch { try { p = await fetch(MG.monitorBakedUrl()).then((r) => r.json()); stale = true; } catch { return; } }
  if (!p.groupings) { try { const u = MG.monitorBakedUrl(); if (u) { const b = await fetch(u).then((r) => (r.ok ? r.json() : null)); p.groupings = b?.groupings || null; } } catch {} }
  if (p.groupings) { G = p.groupings; for (const x of [...(p.extra || []), ...(p.stocks || [])]) Q[sym(x.s)] = x; for (const [t, v] of Object.entries(G.co)) if (v[4] && Q[t] && !Q[v[4]]) Q[v[4]] = Q[t]; draw(document.getElementById('f').value); }
  const q = new Date(p.quoteTime || p.asOf);
  const et = q.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
  const d = q.toLocaleDateString('en-US', { timeZone: 'America/New_York', weekday: 'short', day: 'numeric', month: 'short' });
  const st = document.getElementById('stat');
  st.className = 'stat pad' + (stale ? ' bad' : p.session === 'open' ? '' : ' off');
  st.querySelector('span').innerHTML = stale ? `<b>Stale</b> · live data not answering; showing prices as of <b>${et} ET</b>, ${d}` : `${TXT[p.session] || 'Market'} · prices as of <b>${et} ET</b>, ${d}`;
  st.hidden = false;
})();
</script>
