<!doctype html>
<html lang="en"><head>
<meta name="mowgli-static" content="/mowgli-site/"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mowgli</title>
<link rel="icon" href="/mowgli-site/mowgli-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Styles: the approved Deep Field design (design/company-page/overview.html), unchanged, plus the live-page additions at the end. -->
<style>
:root{--brand:#104c97;--sp:#070a1a;--c1:#1a1a44;--c2:#1b1236;--c3:#0f2140;--tint:#104c97;--dust:#aa96ff;
--ease:cubic-bezier(.3,.7,.2,1);--dur:.32s;--gap:clamp(18px,2.2vw,56px);--rgap:clamp(16px,3.4vh,48px);--padk:1}
/* ---------- card treatments ---------- */
body[data-cards=frost]{--card:rgb(13 16 34 / var(--op));--cardbd:rgba(255,255,255,.14);--blur:blur(18px) saturate(1.15);
 --ink:#f3f4f9;--ink2:#cfd3e1;--mut:#9aa2b9;--line:rgba(255,255,255,.10);--sub:rgba(255,255,255,.07);--sub2:rgba(255,255,255,.13);
 --chip:#efedea;--up:#4fd69f;--dn:#ff8a7a;--map:rgba(210,220,255,.13);--mapst:rgba(210,220,255,.22);--sh:0 18px 50px rgba(0,0,0,.35);--dark:1}
body[data-cards=dusk]{--card:color-mix(in oklab,color-mix(in oklab,#39322f 84%,var(--c1)) calc(var(--op)*100%),transparent);--blur:blur(18px);--cardbd:rgba(255,255,255,.06);
 --ink:#f4efe9;--ink2:#d6cec6;--mut:#a89f98;--line:rgba(255,255,255,.09);--sub:rgba(255,255,255,.06);--sub2:rgba(255,255,255,.12);
 --chip:#efebe5;--up:#57d19b;--dn:#ff8b7b;--map:rgba(255,240,225,.12);--mapst:rgba(255,240,225,.2);--sh:0 18px 50px rgba(0,0,0,.45);--dark:1}
body[data-cards=mist]{--card:color-mix(in oklab,color-mix(in oklab,#e3e1e6 90%,var(--c1)) calc(var(--op)*100%),transparent);--blur:blur(18px);--cardbd:rgba(255,255,255,.35);
 --ink:#1b1b22;--ink2:#383741;--mut:#5c5a67;--line:rgba(20,20,45,.11);--sub:rgba(20,20,45,.06);--sub2:rgba(20,20,45,.11);
 --chip:transparent;--up:#16774a;--dn:#b8392f;--map:rgba(30,40,80,.12);--mapst:rgba(30,40,80,.2);--sh:0 18px 50px rgba(0,0,0,.40)}
/* accent: the company colour, lifted for dark cards; or a neutral steel */
body{--acc:var(--brand)}
body[data-acc=neutral]{--acc:#b9b2a5}
body:not([data-cards=mist]){--accx:color-mix(in oklab,var(--acc) 72%,#fff);--accbg:color-mix(in oklab,var(--acc) 42%,transparent)}
body[data-cards=mist]{--accx:color-mix(in oklab,var(--acc) 85%,#000);--accbg:color-mix(in oklab,var(--acc) 13%,transparent)}
body[data-dens=roomy]{--gap:clamp(24px,3vw,80px);--rgap:clamp(22px,4.4vh,64px);--padk:1.3}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(11px,min(.7vw,1.38vh),18px)}
body{background:var(--sp);color:var(--ink);font-family:Manrope,system-ui,sans-serif;height:100vh;overflow:hidden;
 display:grid;grid-template-rows:auto 1fr auto;gap:clamp(14px,2.4vh,38px);padding:clamp(12px,2.2vh,32px) clamp(20px,2.6vw,66px) clamp(10px,1.2vh,18px)}
.up{color:var(--up)}.dn{color:var(--dn)}
.pad,.tile,.rail{background:var(--card);border:1px solid var(--cardbd);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.pad{border-radius:22px}
.head,.main,.foot{position:relative;z-index:1}
.lchip{background:var(--chip);border-radius:8px}

/* ---------- header ---------- */
.head{display:flex;align-items:stretch;gap:1.4rem}
.idp{display:flex;align-items:center;gap:1.2rem;padding:.75rem 1.6rem .75rem 1rem;max-width:62%}
.idp img{height:3.3rem;flex:none;padding:.35rem .6rem;box-sizing:content-box;max-width:11rem;object-fit:contain}
.idp h1{font-size:1.45rem;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.idp h1 small{font-size:.8rem;color:var(--mut);font-weight:700;margin-left:.6rem;letter-spacing:.5px}
.idp p{font-size:.92rem;color:var(--ink2);line-height:1.35;margin-top:.15rem}
.idp .cls{font-size:.78rem;color:var(--mut);margin-top:.3rem}
.idp .cls b{color:var(--ink2);font-weight:700}
.demo{align-self:center;font-size:.8rem;font-weight:700;color:var(--ink);padding:.55rem 1rem;border-radius:14px;border:1px dashed var(--mut);max-width:20rem;line-height:1.3}
.demo:empty{display:none}
.pxp{margin-left:auto;padding:.7rem 1.6rem;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.pxp .p{font-size:2.1rem;font-weight:800;letter-spacing:-1px;line-height:1}
.pxp .c{font-size:.95rem;font-weight:700;margin-top:.3rem;font-variant-numeric:tabular-nums}
.pxp .c small{color:var(--mut);font-weight:500;margin-left:.5rem}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:1fr var(--railw,4.4rem);gap:var(--gap);min-height:0;transition:grid-template-columns var(--dur) var(--ease)}
body.rail-open .main{--railw:clamp(300px,24vw,560px)}
.field{display:grid;grid-template-columns:var(--cols,1fr 1fr 1fr);grid-template-rows:var(--rows,.9fr 1.1fr);
 column-gap:var(--gap);row-gap:var(--rgap);min-height:0;
 transition:grid-template-columns var(--dur) var(--ease),grid-template-rows var(--dur) var(--ease)}
body.instant .field,body.instant .main{transition:none}
.tile{border-radius:26px;container-type:size;overflow:hidden;cursor:zoom-in;position:relative;min-width:0;min-height:0}
.tile.open{cursor:zoom-out}
.company{grid-area:1/1}.money{grid-area:1/3}.brands{grid-area:2/1}.fin{grid-area:2/2}.next{grid-area:2/3}
.in{font-size:clamp(11px,min(2.3cqw,3.5cqh),18px);height:100%;padding:calc(1.2em*var(--padk)) calc(1.45em*var(--padk)) calc(1.05em*var(--padk));display:flex;flex-direction:column;min-height:0}
.th{display:flex;align-items:center;gap:.7em;flex:none}
.lbl{font-size:.8em;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doorl{margin-left:auto;display:flex;gap:.4em;flex:none}
.door{font-size:.78em;font-weight:800;color:var(--accx);background:var(--accbg);border-radius:20px;padding:.3em .85em;text-decoration:none;white-space:nowrap}
.xp{width:1.9em;height:1.9em;border-radius:50%;border:0;background:var(--sub2);display:grid;place-items:center;cursor:pointer;flex:none}
.xp svg{width:.95em;height:.95em;stroke:var(--ink2);fill:none;stroke-width:2.2}
.tile.open .xp .o,.tile:not(.open) .xp .c{display:none}
.peek{display:none;margin-top:.5em;font-size:1.05em;font-weight:700;line-height:1.35;color:var(--ink2)}
.peek b{color:var(--ink)}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:2.2em;margin-top:.8em}
.std{min-height:0;display:flex;flex-direction:column}
.full{display:none;min-height:0;flex-direction:column;opacity:0}
.tile.open .body{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.tile.open .full{display:flex;animation:fin .35s .18s var(--ease) forwards}
@keyframes fin{to{opacity:1}}
.tile.shrunk .in{font-size:clamp(11.5px,1rem,17px)}
.tile.shrunk .peek{font-size:1.2em;margin-top:.7em}
.tile.shrunk .body{display:none}.tile.shrunk .peek{display:block}
.tile.shrunk .doorl .door{display:none}
.brands .std,.next .std{justify-content:space-between}
.company .std{justify-content:space-evenly}
.note{font-size:.76em;color:var(--mut);line-height:1.4}
.big{font-size:2.5em;font-weight:800;letter-spacing:-1px;line-height:1}
.mid{font-size:1em;line-height:1.4;color:var(--ink2)}
.mid b{color:var(--ink)}
h5{font-size:.74em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);margin:0 0 .45em}
.sec{margin-top:1.1em}.sec:first-child{margin-top:0}
.m{font-size:.7em;vertical-align:super;color:var(--mut);font-weight:700}
@container (max-height:300px){.lo{display:none!important}}
@container (max-width:380px){.lo{display:none!important}}
@container (max-height:300px){.fin .ft{font-size:.86em}.fin .ft td{padding:.28em .5em}.fin .ft td small{display:none}.fin .ft th img{height:1.25em}.fin .acn{padding-top:.4em}.fin .v-self.note,.fin .spx{display:none!important}.fin .spk{height:1.5em;margin:.2em 0}.fin .mc b{font-size:1.3em}.fin .mg{gap:.5em 1.2em}}

/* stat grid + key/value */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:.75em 1.4em}
.sg div{display:flex;flex-direction:column;min-width:0}
.sg span{font-size:.76em;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg b{font-size:1.14em;font-weight:800;letter-spacing:-.2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sg.sm b{font-size:1.02em}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:1em;font-size:.88em;padding:.4em 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv:last-child{border:0}
.kv b{font-weight:800;text-align:right;min-width:4.2em;font-variant-numeric:tabular-nums}
.kv i{font-style:normal;color:var(--mut);text-align:right;min-width:5.6em;font-weight:600}
.split{display:flex;height:1.6em;border-radius:7px;overflow:hidden;font-size:.76em;font-weight:800;margin:.4em 0 .2em}
.split div{display:flex;align-items:center;padding:0 .7em;color:#fff;white-space:nowrap}

/* chart */
.chart{position:relative;flex:1;min-height:5em;margin-top:.4em}
.chart svg{position:absolute;inset:0;width:100%;height:calc(100% - 1.3em)}
.chart .cl{stroke:var(--accx)}
.chart .ca{stop-color:var(--accx)}
.mx{position:absolute;left:0;right:0;bottom:0;height:1.2em}
.mx span{position:absolute;font-size:.72em;color:var(--mut);transform:translateX(-50%)}
.em{position:absolute;bottom:1.45em;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.em i{width:1px;height:.9em;background:var(--mut);opacity:.55}
.em b{font-size:.58em;font-weight:800;color:var(--mut);width:1.45em;height:1.45em;border-radius:50%;border:1px solid var(--mut);display:grid;place-items:center;opacity:.8}
.mn2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.6em;flex:1;min-height:0}
.mn2>div{display:flex;flex-direction:column;min-height:0}
.er{display:grid;grid-template-columns:1fr auto auto;gap:.2em 1em;font-size:.86em;align-items:baseline}
.er span{color:var(--ink2)}.er i{font-style:normal;color:var(--mut);font-size:.9em;text-align:right}
.er b{text-align:right;font-variant-numeric:tabular-nums}
.er .hd{font-size:.8em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.react{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin:.8em 0 .6em}
.react div{background:var(--sub);border-radius:12px;padding:.5em .7em}
.react span{display:block;font-size:.74em;color:var(--mut);font-weight:700}
.react b{font-size:1.35em;font-weight:800;font-variant-numeric:tabular-nums}

/* brands + competitors */
.tbar{display:flex;gap:3px;height:1.8em;margin:.2em 0 .5em}
.tbar div{border-radius:6px;display:grid;place-items:center;color:#fff;font-size:.74em;font-weight:800;overflow:hidden}
.tlg{display:grid;grid-template-columns:1fr 1fr;gap:.25em 1.2em;font-size:.8em;color:var(--ink2)}
.tlg div{display:flex;align-items:center;gap:.45em;white-space:nowrap;overflow:hidden}
.tlg i{width:.7em;height:.7em;border-radius:3px;flex:none}
.tlg em{font-style:normal;margin-left:auto;font-weight:800;color:var(--ink)}
.cr{display:grid;grid-template-columns:6.6em 1fr 5.6em;gap:.8em;align-items:center;padding:.18em 0}
.cr img{height:1.75em;width:6.6em;object-fit:contain;object-position:center;padding:.2em .4em}
body[data-cards=mist] .cr img{object-position:left center;padding-left:0}
.cr .cb{display:flex;flex-direction:column;gap:2px}
.cr .b1{height:.62em;border-radius:4px;background:var(--sub2)}
.cr .b2{height:.34em;border-radius:3px;background:color-mix(in oklab,var(--up) 45%,transparent)}
.cr.me .b1{background:var(--accx)}.cr.me .b2{background:var(--up)}
.cr .cn{font-size:.82em;text-align:right;line-height:1.15}
.cr .cn b{display:block;font-size:1.05em}
.cr .cn span{color:var(--mut)}
.key{display:flex;gap:1em;font-size:.72em;color:var(--mut);margin:.2em 0 .25em}
.key i{display:inline-block;width:.8em;height:.5em;border-radius:2px;margin-right:.35em}
.tt{width:100%;border-collapse:collapse;font-size:.82em}
.tt th{font-size:.82em;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:800;padding:0 .6em .4em 0}
.tt td{padding:.4em .6em .4em 0;border-top:1px solid var(--line);vertical-align:middle;color:var(--ink2)}
.tt td.n,.tt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt td:first-child{font-weight:800;white-space:nowrap;color:var(--ink)}
.tt .tsw{display:inline-block;width:.7em;height:.7em;border-radius:3px;margin-right:.45em}
.tt tr.me td{background:var(--sub)}
.tt img{height:1.35em;width:5em;object-fit:contain;vertical-align:middle;padding:.1em .3em}
.tt th img{height:1.6em;width:5.4em}
.tt td.me,.tt th.me{background:var(--accbg)}
.tt td.me{color:var(--ink);font-weight:800}

/* financials */
.ft{width:100%;border-collapse:collapse;font-size:.94em}
.ft th{font-weight:800;padding:0 .5em .45em;text-align:right}
.ft th:first-child{text-align:left;padding-left:0}
.ft td{padding:.5em .5em;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.ft td:first-child{text-align:left;padding-left:0;color:var(--ink2);white-space:normal}
.ft td.me{color:var(--ink);font-weight:800;background:var(--accbg)}
.ft th.me{background:var(--accbg);border-radius:8px 8px 0 0}
.ft th img{height:1.45em;width:4.8em;object-fit:contain;padding:.12em .3em;vertical-align:middle}
.ft td small{display:block;color:var(--mut);font-size:.82em;font-weight:500}
.seg{display:flex;margin-left:auto;background:var(--sub);border-radius:20px;padding:2px;flex:none}
.seg button{font:inherit;font-size:.74em;font-weight:800;color:var(--mut);background:none;border:0;border-radius:18px;padding:.28em .8em;cursor:pointer}
.seg button.on{background:var(--accbg);color:var(--accx)}
.fin .doorl{margin-left:.4em}
body:not([data-fin=peers]) .fin .v-peers,body[data-fin=peers] .fin .v-self{display:none!important}
.fin .full>div{display:flex;min-height:0}
.mg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9em 1.3em;flex:1;min-height:0;align-content:start}
.mc{display:flex;flex-direction:column;min-width:0}
.mc span{font-size:.76em;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc b{font-size:1.55em;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.mc em{font-style:normal;font-size:.72em;color:var(--mut);font-weight:600}
.spk{display:flex;align-items:flex-end;gap:3px;height:2.6em;margin:.35em 0 .15em}
.spk i{flex:1;border-radius:3px 3px 1px 1px;background:var(--sub2);min-height:2px}
.spk i:last-child{background:var(--accx)}
.spk i{background:color-mix(in oklab,var(--accx) 28%,transparent)}
.spx{display:flex;justify-content:space-between;font-size:.6em;color:var(--mut)}
.hk{width:100%;border-collapse:collapse;font-size:.8em}
.hk th{font-size:.8em;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);font-weight:800;text-align:left;padding:0 .5em .25em 0}
.hk td{padding:.26em .5em .26em 0;border-top:1px solid var(--line);color:var(--ink2);vertical-align:baseline}
.hk td:first-child{font-weight:800;color:var(--ink);white-space:nowrap}
.hk .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ut th:first-child{width:auto}.ut td small{display:block;margin:0;font-size:.78em}
.hk small{color:var(--mut);font-size:.85em;margin-left:.2em}
@container (max-height:420px){.brands .tlg,.brands .cr.lo{display:none!important}}
body[data-layout=previous] .brands .std .cr.lo{display:none!important}
.brands .std .cr img{height:1.5em}.brands .std .cr{padding:.1em 0}
.brands .std>div+div{margin-top:.7em}
.earn,.ins{display:none}
body:not([data-layout=previous]) .field{grid-template-rows:var(--rows,.72fr .33fr 1fr)}
body:not([data-layout=previous]) .field .company{grid-area:1/1/2/2}
body[data-layout=centre] .earn{display:block;grid-area:2/3}
body[data-layout=insiders] .ins{display:block;grid-area:2/3}
body[data-layout=centre] .fin,body[data-layout=insiders] .fin{grid-area:2/2}
body[data-layout=insiders] .money{grid-area:1/2}body[data-layout=insiders] .next{grid-area:1/3}body[data-layout=insiders] #sig .mark{display:none}body[data-layout=insiders] #hmark{display:flex}body[data-layout=insiders] .pxp{margin-left:0}
.earn .std{justify-content:space-between}
.earn .er{row-gap:.45em}
.it{display:grid;grid-template-columns:4.2em 1fr auto;gap:.8em;align-items:baseline;padding:.45em .5em;border-bottom:1px solid var(--line);font-size:.9em;color:var(--mut)}
.it b{font-variant-numeric:tabular-nums}.it time{font-size:.85em}
.it.buy{background:color-mix(in oklab,var(--up) 16%,transparent);border-radius:10px;color:var(--ink);border:0}
.it.buy b{color:var(--up)}
body[data-page=mo] .pg-hlt,body:not([data-page=mo]) .pg-mo{display:none!important}
body[data-layout=insiders] #field-mo .earn{display:block;grid-area:2/3}
.pr{display:grid;grid-template-columns:5.2em 3.4em 4.6em 1fr;gap:.7em;align-items:center;font-size:.84em;padding:.25em 0;border-top:1px solid var(--line)}
.pr img{height:1.5em;width:5.2em;object-fit:contain;padding:.12em .3em}
.pr span{font-weight:800}.pr b{text-align:right;font-variant-numeric:tabular-nums}.pr i{font-style:normal;color:var(--mut);font-size:.9em;line-height:1.25}
.lbadge{height:1.5em;width:5.2em;display:grid;place-items:center;border-radius:8px;background:var(--chip);color:#3a3a44;font-weight:800;font-size:.9em;letter-spacing:.5px;border:1px solid var(--line)}
body[data-cards=mist] .lbadge{background:var(--sub2)}
.ft th .lbadge{width:4.8em;height:1.45em;margin-left:auto}
.acn{margin-top:auto;padding-top:.6em;font-size:.78em;color:var(--ink2);line-height:1.4;border-top:1px solid var(--line)}
.acn b{color:var(--mut);font-weight:800;letter-spacing:.8px;text-transform:uppercase;font-size:.88em;margin-right:.4em}
.bridge{display:flex;flex-direction:column;gap:.28em;font-size:.84em}
.bridge div{display:grid;grid-template-columns:11em 1fr 4.5em;gap:.7em;align-items:center}
.bridge .bt{height:.85em;position:relative}
.bridge .bt i{position:absolute;top:0;bottom:0;border-radius:4px}
.bridge b{text-align:right;font-variant-numeric:tabular-nums}

/* next */
.nx{display:grid;grid-template-columns:5.2em 1fr;gap:.2em 1em;padding:.5em 0;border-bottom:1px solid var(--line);align-items:baseline}
.nx:last-child{border:0}
.nx time{font-size:.82em;font-weight:800;color:var(--accx)}
.nx div{font-size:.92em;line-height:1.35;color:var(--ink2)}
.nx div b{color:var(--ink)}
.rg{display:grid;grid-template-columns:8em 1fr 3em;gap:.7em;align-items:center;font-size:.84em;padding:.22em 0;color:var(--ink2)}
.rg .bar{height:.7em;border-radius:5px;background:var(--sub)}.rg .bar i{display:block;height:100%;border-radius:5px;background:var(--accx)}
.rg b{text-align:right;color:var(--ink)}
.mapw{position:relative;height:9em;margin-top:.3em}
.mapw svg{position:absolute;inset:0;width:100%;height:100%}
.mapw .land{fill:var(--map);stroke:var(--mapst)}
.mapw circle{fill:var(--accx);fill-opacity:.8}
.mapw text{fill:var(--ink)}
.mapw text.in{fill:var(--sp)}

.cal{flex:1;min-height:0;overflow:hidden}
.filt{display:flex;gap:.35rem;margin:.5rem 0 .3rem}

.foot{display:flex;flex-direction:column;gap:.45rem;min-width:0}

.try button.on{background:#e9ebf3;color:#12142a;border-color:#e9ebf3}

/* ---------- deep field ---------- */

body:not([data-layout=previous]) .idp{display:none}

/* hero: logo floating on the sky, name beneath; light nav mark at left, price at right */
.navm,.hero{display:none}

.hero .hr,.hero .hsub{display:none}

 background:linear-gradient(180deg,rgb(8 10 22 / var(--bop,.3)),rgb(8 10 22 / calc(var(--bop,.3)*.85)));-webkit-backdrop-filter:blur(16px) saturate(1.1);backdrop-filter:blur(16px) saturate(1.1);
 -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}

.ers{display:flex;flex-direction:column}
